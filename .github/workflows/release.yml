# Tag and publish a GitHub release whenever manifest.json's version changes.
# Bump "version", push to main, and this creates vX.Y.Z with generated notes.
name: release

on:
  push:
    branches: [main]
    paths: [manifest.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          # Only plain semver reaches the shell and tag names.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::manifest.json version is not X.Y.Z"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create release if the tag is new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists; nothing to release."
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "Netmount ${TAG#v}" --generate-notes --latest
